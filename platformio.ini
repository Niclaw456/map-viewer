; =====================================================================
;  M5Stack Cardputer-Adv  -  Off-grid Offline Map Viewer
;  ESP32-S3FN8 | ST7789V2 240x135 | Cap LoRa-1262 (GPS) | MicroSD
; =====================================================================
[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform         = espressif32@^6.9.0
board            = m5stack-stamps3        ; ESP32-S3 (StampS3 core = Cardputer MCU)
framework        = arduino
monitor_speed    = 115200
upload_speed     = 1500000

; ---- Build flags -----------------------------------------------------
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1          ; USB-CDC serial for the S3
    -DBOARD_HAS_PSRAM
    -std=gnu++17
build_unflags =
    -std=gnu++11

; ---- Flash / PSRAM ---------------------------------------------------
board_build.flash_mode = qio
board_build.f_flash     = 80000000L
board_build.partitions  = default_8MB.csv   ; ESP32-S3FN8 = 8 MB flash

; ---- Libraries -------------------------------------------------------
lib_deps =
    m5stack/M5Unified@^0.2.7            ; M5Unified + M5GFX (Cardputer-Adv aware)
    m5stack/M5Cardputer@^1.0.3          ; keyboard driver (matrix + TCA8418/ADV)
    mikalhart/TinyGPSPlus@^1.1.0        ; NMEA parser

lib_ldf_mode = deep+
